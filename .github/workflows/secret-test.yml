name: Secrets Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  secret-test:
    runs-on: ubuntu-latest
    env:
      DOKU_API_TOKEN: ${{ secrets.DOKU_API_TOKEN }}
      UMGEBUNG: ${{ vars.UMGEBUNG }}
    steps:
      - name: Prüfen, ob das Secret vorhanden ist
        run: |
          if [ -n "$DOKU_API_TOKEN" ]; then
            echo "Secret ist gesetzt"
          else
            echo "Secret fehlt"
            exit 1
          fi

      - name: Secret wird in den Logs maskiert
        run: echo "Token ist $DOKU_API_TOKEN"

      - name: Länge des Secrets anzeigen
        run: echo "Das Secret hat ${#DOKU_API_TOKEN} Zeichen"

      - name: Variable anzeigen
        run: echo "Umgebung ist $UMGEBUNG"
